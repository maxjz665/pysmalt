{% extends 'index.html' %}

{% block content %}
    <h2>Добавление нового дерева решений</h2>
    <form method="post" enctype="multipart/form-data">
    <div class="container">
    <div class="row">
    <div class="form-group col-lg-10">
        <label for="input_name">Название дерева решений</label>
        <input type="text" class="form-control" name="input_name" id="input_name" placeholder="Введите название дерева решений" value="{{ input_name }}">
    </div>
    </div>
    <div class="row">
    <div class="form-group mb-2 col-lg-5">
        <label for="firstList">Список текстов первой группы</label>
         <select class="form-control selectpicker" data-live-search="true" id="firstList" name="first_list" style="width: 90%">
             {% for item in lists %}
                 <option value="{{ item.id }}" {% if first_list == item.id %}selected{% endif %}>{{ item.name }}</option>
             {% endfor %}
         </select>
    </div>
        
    <div class="form-group mb-2 col-lg-5">
        <label for="secondList">Список текстов второй группы</label>
         <select class="form-control selectpicker" data-live-search="true" id="secondList" name="second_list" style="width: 90%">
             {% for item in lists %}
                 <option value="{{ item.id }}" {% if second_list|add:"0" == item.id %}selected{% endif %}>{{ item.name }}</option>
             {% endfor %}
         </select>
    </div>
    </div>
        
    <div class="row">
        <div class="form-group col-lg-3">
            <label for="block_size">Размер блока</label>
            <input type="text" class="form-control" name="block_size" id="block_size" placeholder="Введите размер блока" value="{{ block_size }}">
        </div>
    </div>

    {% csrf_token %}
    <div class="row-cols-1">
        <button type="submit" class="btn btn-primary" name="submit" id="submit" value="create">Создать</button>
        <button type="reset" class="btn btn-info">Сбросить</button>
    </div>
    </div>
    </form>
{% endblock %}
